// The Android Gradle Plugin builds the native code with the Android NDK.

import java.util.Properties

group = "dev.zvec.zvec_flutter_android"
version = "1.0"

def requiredNdkVersion = "28.2.13676358"
def prebuiltJniLibsDir = file("$projectDir/src/main/jniLibs")
def generatedJniLibsDir = file("$buildDir/generated/jniLibs")
def sourceBundleDir = file("../zvec/zvec-android-arm64")
def sourceBridgeDir = file("../src")
def sourceBuildRequested = (findProperty("zvecFlutterBuildFromSource")?.toString()?.toBoolean() ?: false)
def sourceBuildAvailable = sourceBundleDir.exists() && sourceBridgeDir.exists()
def useSourceBuild = sourceBuildRequested && sourceBuildAvailable
def prebuiltArm64Dir = new File(prebuiltJniLibsDir, "arm64-v8a")
def prebuiltPluginLib = new File(prebuiltArm64Dir, "libzvec_flutter_android.so")

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}

def resolveAndroidSdkDir = {
    def configuredSdkDir = localProperties.getProperty("sdk.dir")
    if (configuredSdkDir) {
        return file(configuredSdkDir)
    }

    def envSdkDir = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
    if (envSdkDir) {
        return file(envSdkDir)
    }

    throw new GradleException("Android SDK path is not configured. Set sdk.dir in local.properties or ANDROID_HOME/ANDROID_SDK_ROOT.")
}

def resolveLibcxxShared = {
    def ndkRoot = new File(resolveAndroidSdkDir(), "ndk/${requiredNdkVersion}")
    def matches = fileTree(new File(ndkRoot, "toolchains/llvm/prebuilt")) {
        include "*/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
    }.files.toList().sort { a, b -> a.path <=> b.path }

    if (matches.isEmpty()) {
        throw new GradleException("Unable to find libc++_shared.so under ${ndkRoot}. Install Android NDK ${requiredNdkVersion}.")
    }

    return matches.first()
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath("com.android.tools.build:gradle:8.11.1")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "dev.zvec.zvec_flutter_android"

    // Bumping the plugin compileSdk version requires all clients of this plugin
    // to bump the version in their app.
    compileSdk = 36

    // Use the NDK version
    // declared in /android/app/build.gradle file of the Flutter project.
    // Replace it with a version number if this plugin requires a specific NDK version.
    // (e.g. ndkVersion "23.1.7779620")
    ndkVersion = requiredNdkVersion

    if (useSourceBuild) {
        // Maintainers can rebuild the native bridge from the bundled zvec source payload.
        externalNativeBuild {
            cmake {
                path = "../src/CMakeLists.txt"

                // The default CMake version for the Android Gradle Plugin is 3.10.2.
                // https://developer.android.com/studio/projects/install-ndk#vanilla_cmake
                //
                // The Flutter tooling requires that developers have CMake 3.10 or later
                // installed. You should not increase this version, as doing so will cause
                // the plugin to fail to compile for some customers of the plugin.
                // version "3.10.2"
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            if (!useSourceBuild) {
                jniLibs.srcDir(prebuiltJniLibsDir)
            }
            jniLibs.srcDir(generatedJniLibsDir)
        }
    }

    defaultConfig {
        minSdk = 24

        ndk {
            abiFilters "arm64-v8a"
        }

        if (useSourceBuild) {
            externalNativeBuild {
                cmake {
                    abiFilters "arm64-v8a"
                    cppFlags "-std=c++17", "-fexceptions", "-frtti"
                }
            }
        }
    }
}

tasks.register("verifyPrebuiltJniLibs") {
    doLast {
        if (!prebuiltPluginLib.exists()) {
            throw new GradleException(
                "Missing prebuilt Android libraries under ${prebuiltArm64Dir}. " +
                    "Expected libzvec_flutter_android.so. " +
                    "To rebuild from source in this repository, rerun the build with -PzvecFlutterBuildFromSource=true."
            )
        }
    }
}

tasks.register("copyLibcxxShared", Copy) {
    from(resolveLibcxxShared())
    into(new File(generatedJniLibsDir, "arm64-v8a"))
}

tasks.named("preBuild").configure {
    dependsOn(tasks.named("copyLibcxxShared"))
    if (!useSourceBuild) {
        dependsOn(tasks.named("verifyPrebuiltJniLibs"))
    }
}
